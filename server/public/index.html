<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<!-- 正式应用图标:移动端「添加到主屏幕」/浏览器标签页都显示品牌图标 -->
<link rel="icon" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Claude Desk" />
<meta name="theme-color" content="#fffdf8" />
<title>Claude Desk · 手机遥控</title>
<style>
  :root {
    /* 白亮色主题:奶油底色 + 黑描边 logo,清爽干净 */
    --bg: #f6f1ea; --surface: #ffffff; --border: #e6dccb; --border2: #d8ccb6;
    --text: #22252a; --text2: #4a4e55; --muted: #8a8578; --accent: #e8762c;
    --ok: #2f9e44; --err: #d9480f; --user-bg: #e8762c; --ans-bg: #ffffff;
    --accent-soft: rgba(232, 118, 44, .10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    font-size: 15px; display: flex; flex-direction: column;
    height: 100vh; height: var(--app-h, 100dvh);
  }
  header.top {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top));
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  header.top b { font-size: 15px; }
  header.top .sub { font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  /* 顶部工具按钮:字符图标(‹/↻/✕)放大到 24px 加粗,配大触摸区(≥42×44),避免"小气看不见" */
  header.top .back {
    background: none; border: none; color: var(--accent); cursor: pointer;
    padding: 8px 10px; line-height: 1; font-weight: 700; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    min-width: 42px; min-height: 44px;
  }
  /* 文字型工具按钮(断开/停止)不必用 24px 图标字号,保持文字适中但共用大触摸区 */
  header.top .back#btn-device-back, header.top .back#btn-stop { font-size: 14px; font-weight: 600; }
  header.top .top-logo { height: 26px; width: auto; flex: 0 0 auto; border-radius: 6px; }
  main { flex: 1 1 auto; overflow-y: auto; padding: 14px 14px 20px; }
  .view { display: none; }
  /* 每个页面占满视口;flex 布局让 header.top 顶部固定、内容区独立滚动、composer 贴底。
     flex:1 让 .view.on 撑满 body 高度:否则消息为空时它会塌缩到内容高度,
     导致 composer 浮到视口中间。 */
  .view.on { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }

  /* 连接 */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card .d { color: var(--muted); font-size: 13px; margin: 0 0 14px; line-height: 1.6; }
  label.f { display: block; margin-bottom: 12px; }
  label.f span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%; background: var(--bg); border: 1px solid var(--border2); color: var(--text);
    border-radius: 10px; padding: 11px 12px; font-size: 15px; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button.go {
    width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button.go:disabled { opacity: .5; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .dot.online { background: var(--ok); } .dot.offline { background: var(--err); }
  .url-tip { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }

  #v-connect main { padding: 34px 14px 20px; }
  /* 品牌 logo:直接复用真实图标 apple-touch-icon.png(米色底 + 黑描边显示器 + 耳机),与 assets/icon.png 完全一致 */
  .brand { display: flex; flex-direction: column; align-items: center; text-align: center; margin: 4px 0 14px; }
  .brand .logo { width: 84px; height: auto; display: block; border-radius: 14px; box-shadow: 0 1px 5px rgba(0,0,0,.10); }
  .brand b { font-size: 20px; letter-spacing: .5px; margin-top: 8px; color: var(--text); }
  .brand .tag { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* 列表 */
  .item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; color: var(--text); cursor: pointer;
  }
  .item .tt { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { font-size: 12px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .stat { margin-left: auto; flex: 0 0 auto; font-size: 11px; color: var(--muted); text-align: right; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 13px; }

  /* 对话 */
  .chat { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; padding: 0; }
  .msgs { flex: 1 1 auto; overflow-y: auto; padding: 12px 14px; }
  .bubble { max-width: 88%; border-radius: 14px; padding: 10px 13px; margin-bottom: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .bubble.user { background: var(--user-bg); color: #fff; margin-left: auto; }
  .bubble.ans  { background: var(--ans-bg); color: var(--text); border: 1px solid var(--border); }
  .bubble.err  { background: rgba(248, 81, 73, .15); color: var(--err); }
  .bubble.running { opacity: .7; }
  @keyframes blink { 50% { opacity: .3; } }
  .running-dot { display: inline-block; animation: blink 1.2s infinite; }

  /* 电脑端原生选择器(↑/↓ 那种):手机端渲染成可点按钮,点击发 choose 注入按键 */
  .chooser { display: flex; flex-direction: column; gap: 8px; margin: -2px 0 12px; max-width: 88%; }
  .chooser-btn {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: var(--surface); border: 1px solid var(--accent); color: var(--text);
    border-radius: 10px; padding: 11px 13px; font-size: 14px; cursor: pointer; width: 100%;
  }
  .chooser-btn .k {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .chooser-btn .lb { flex: 1 1 auto; word-break: break-word; }
  .chooser-btn:active { background: var(--accent-soft); }
  .chooser-btn:disabled { opacity: .5; cursor: default; }
  /* 多选(复选框)选择器:可勾多行 + 提交按钮 */
  .chooser-item {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: var(--surface); border: 1px solid var(--border2); color: var(--text);
    border-radius: 10px; padding: 11px 13px; font-size: 14px; cursor: pointer; width: 100%; box-sizing: border-box;
  }
  .chooser-item.on { border-color: var(--accent); background: var(--accent-soft); }
  .chooser-item input[type=checkbox] { flex: 0 0 auto; width: 18px; height: 18px; accent-color: var(--accent); }
  .chooser-item .k {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .chooser-item .lb { flex: 1 1 auto; word-break: break-word; }
  .chooser-submit {
    margin-top: 2px; width: 100%; padding: 12px 13px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: #fff; border: 0; border-radius: 10px; cursor: pointer;
  }
  .chooser-submit:disabled { opacity: .5; cursor: default; }
  .ctx-box { background: var(--surface); border: 1px dashed var(--border2); border-radius: 10px; padding: 10px 12px; margin: 0 14px 10px; font-size: 12px; color: var(--muted); max-height: 30vh; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .ctx-box .tt-top { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .ctx-box .md { white-space: normal; color: var(--text2); font-size: 13px; }
  .ctx-box .md > :first-child { margin-top: 0; }
  .ctx-box .md > :last-child { margin-bottom: 0; }
  .ctx-box .md pre { max-height: 180px; margin: 6px 0; }
  .ctx-box .md blockquote, .ctx-box .md table { margin: 6px 0; }
  .composer { flex: 0 0 auto; display: flex; gap: 8px; padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  .composer input { flex: 1 1 auto; }
  .composer button { flex: 0 0 auto; }
  button.round { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 16px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button.round.stop { background: var(--err); color: #fff; }

  /* 断开横幅 */
  .banner { position: sticky; top: 0; z-index: 5; background: rgba(248, 81, 73, .9); color: #fff; text-align: center; font-size: 12px; padding: 5px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 100px; background: #30363d; color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 13px; display: none; z-index: 20; }

  /* 移动端 Markdown 精简渲染 */
  .md { line-height: 1.55; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5 {
    margin: 12px 0 6px; font-size: 15px; font-weight: 700; line-height: 1.3; color: var(--text);
  }
  .md h1 { font-size: 16px; }
  .md h4, .md h5 { font-size: 14px; }
  .md p { margin: 6px 0; }
  .md ul, .md ol { margin: 6px 0; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md a { color: var(--accent); word-break: break-all; }
  .md strong { color: var(--text); }
  .md blockquote {
    margin: 8px 0; padding: 6px 10px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); color: var(--text2); border-radius: 4px;
  }
  .md blockquote p { margin: 2px 0; }
  .md code {
    background: rgba(0, 0, 0, .06); color: #b45309; padding: 1px 5px;
    border-radius: 4px; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .md pre {
    margin: 8px 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; overflow-x: auto; max-height: 260px; overflow-y: auto;
    font-size: 12.5px; line-height: 1.5; white-space: pre; -webkit-overflow-scrolling: touch;
  }
  .md pre code { background: none; color: var(--text2); padding: 0; font-size: inherit; }
  .md table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--border2); padding: 5px 8px; text-align: left; }
  .md th { background: var(--surface); font-weight: 700; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .md div.highlight, .md pre.highlight { overflow-x: auto; }
</style>
</head>
<body>
  <!-- 连接 -->
  <section id="v-connect" class="view on">
    <main>
      <div class="card">
        <div class="brand">
          <img class="logo" src="apple-touch-icon.png" alt="Claude Desk" />
          <b>Claude Desk</b>
          <div class="tag">手机遥控 · 远程连接你的电脑</div>
        </div>
        <p class="d">通过云中转服务连接自己的电脑：输入与电脑端「云连接」一致的 <b>地址</b> 和 <b>token</b>，
        即可查看电脑上所有 claude 会话并远程对话。发送的消息会同步出现在电脑端终端里，回复也会自动传回。</p>
        <label class="f"><span>服务器地址</span>
          <input id="in-host" placeholder="ws://1.2.3.4:8123 或 ws://主机名:端口" autocomplete="off" />
        </label>
        <label class="f"><span>token（验证密钥）</span>
          <input id="in-token" type="password" placeholder="在服务器 config.json 或启动日志里查看" autocomplete="off" />
        </label>
        <button id="btn-connect" class="go">连接</button>
        <div class="url-tip" id="url-tip"></div>
      </div>
    </main>
  </section>

  <!-- 设备 -->
  <section id="v-devices" class="view">
    <header class="top">
      <img class="top-logo" src="apple-touch-icon.png" alt="" />
      <b>选择电脑</b><span class="sub">（在线设备）</span>
      <span style="margin-left:auto"><button class="back" id="btn-device-back">断开</button></span>
    </header>
    <main id="devlist"></main>
  </section>

  <!-- 会话 -->
  <section id="v-sessions" class="view">
    <header class="top">
      <button class="back" id="btn-session-back">‹</button>
      <span style="flex:1;min-width:0"><b id="dev-name"></b><div class="sub" id="session-sub"></div></span>
      <button class="back" id="btn-refresh-sessions" title="刷新">↻</button>
    </header>
    <main id="seslist"></main>
  </section>

  <!-- 对话 -->
  <section id="v-chat" class="view">
    <div class="banner" id="chat-banner" style="display:none"></div>
    <header class="top">
      <button class="back" id="btn-chat-back">‹</button>
      <span style="flex:1;min-width:0"><b id="chat-title"></b><div class="sub" id="chat-cwd"></div></span>
      <button class="back" id="btn-stop" style="display:none">■ 停止</button>
      <button class="back" id="btn-close-session" title="关闭该会话">✕</button>
    </header>
    <div class="chat">
      <div class="ctx-box" id="chat-ctx" style="display:none"></div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <input id="in-msg" placeholder="输入消息，回车发送…" autocomplete="off" />
        <button class="round" id="btn-send">发送</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script src="lib/marked.min.js"></script>
  <script src="lib/purify.min.js"></script>
<script>
(function () {
  "use strict";
  // ---------- 状态 ----------
  let ws = null;                 // WebSocket 连接
  let token = localStorage.getItem("cd-token") || "";
  let curDevice = null;          // 选中的设备 {deviceId,deviceName}
  let curSession = null;         // 选中的会话 {id,title,cwd}
  let devices = [];              // 在线设备列表(服务端推送/应答)
  let sessions = [];             // 当前设备会话列表
  let msgs = [];                 // 当前会话的消息气泡 [{dir:'user'|'ans', text, running}]
  let msgsCache = new Map();     // sessionId -> msgs 副本;切会话/断线后重开能恢复历史
  let pendingExec = null;        // 进行中的 exec msgId
  let lastAnsIndex = -1;         // 等待回答的气泡下标
  let reconnectTimer = null, retry = 0;
  let manualClose = false;
  // 自动刷新:会话打开期间定时拉服务器 DB 历史,桌面端/其它端产生新消息时手机端自动跟进。
  // chatTimer 为轮询定时器;msgsKey 为当前已渲染消息的指纹,内容没变就不重绘(防滚动跳变/输入框失焦)。
  // lastMsgSeq 为「每会话已确认的服务器消息最大 seq」水位:轮询带 afterSeq 只拉增量,避免长会话每次拉全量。
  let chatTimer = null;
  let msgsKey = "";
  let lastMsgSeq = {};

  // 会话历史落盘(localStorage):刷新/重开浏览器后仍能恢复"重新打开会话保留历史记录"。
  // 只存非 running 的消息、每个会话最多 60 条、每条截断 8000 字符,防 localStorage 超限。
  const MSGS_KEY = "cd-msgs";
  function msgsLoad() { try { return JSON.parse(localStorage.getItem(MSGS_KEY) || "{}") || {}; } catch { return {}; } }
  function msgsSave() {
    try {
      const o = {};
      for (const [k, v] of msgsCache) o[k] = v.filter((m) => !m.running).slice(-60).map((m) => ({ dir: m.dir, text: String(m.text || "").slice(0, 8000), seq: Number(m.seq) || 0 }));
      localStorage.setItem(MSGS_KEY, JSON.stringify(o));
    } catch {}
  }

  const $ = (id) => document.getElementById(id);
  const hostInput = $("in-host"), tokenInput = $("in-token");
  // 自动推导地址:取当前页面所在目录前缀(支持 nginx 子路径反代,如 /claude/),
  // 页面在根路径时前缀为空,仍为 ws://host/ws
  const dirPrefix = location.pathname.replace(/\/[^/]*$/, "").replace(/\/+$/, "");
  let autoHost = location.protocol === "https:" ? "wss://" : "ws://";
  autoHost += location.host + dirPrefix + "/ws";

  // 启动时回填上次保存的配置
  hostInput.value = localStorage.getItem("cd-host") || autoHost;
  tokenInput.value = token;
  $("url-tip").textContent = "当前页面地址：" + location.host + "（如已部署，默认用这个地址即可）";

  function go(view) {
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("on"));
    $("v-" + view).classList.add("on");
  }
  function toast(t) {
    const el = $("toast");
    el.textContent = t; el.style.display = "block";
    clearTimeout(toast._t);
    toast._t = setTimeout(() => (el.style.display = "none"), 2600);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  // box-drawing 表格 → markdown 表格:claude 输出 markdown 表格被 TUI 渲染成 │ 框线表格,
  // 剥 ANSI 后以 │ 分隔但 marked 无法渲染,还原成 | a | b | 让 marked 输出真正 HTML 表格。
  // 注意 TUI 会在每两行数据之间画一条 ├─┼─┤ 边框(而非仅表头下一行),故需把「数据行 +
  // 其间边框行」聚合为一个连续表格块:边框行只跳过不输出;数据行并入同一张表,首行作表头。
  function tablesToMarkdown(src) {
    const lines = String(src || "").split("\n");
    const out = [];
    let i = 0;
    const isDataRow = (s) => /[│]/.test(s) && !/^[│├└┌─┬┴┼┐┘┤┃]+$/.test(s.trim());
    const isBorderLine = (s) => /^[│├└┌─┬┴┼┐┘┤┃]+$/.test(s.trim());
    while (i < lines.length) {
      const l = lines[i];
      if (isDataRow(l) || isBorderLine(l)) {
        const rows = [];
        while (i < lines.length) {
          const cur = lines[i];
          if (isDataRow(cur)) {
            const cell = cur.trim().replace(/^[│\s]+/, "").replace(/[│\s]+$/, "").split(/[│]/).map((c) => c.trim().replace(/\s+/g, " "));
            rows.push(cell);
          } else if (!isBorderLine(cur)) {
            break; // 遇到非表格行(正文/空行),结束本块
          }
          i++;
        }
        if (rows.length) {
          out.push("| " + rows[0].join(" | ") + " |");
          out.push("|" + rows[0].map(() => " --- ").join("|") + "|");
          for (let r = 1; r < rows.length; r++) out.push("| " + rows[r].join(" | ") + " |");
          out.push("");
          continue;
        }
      }
      out.push(l);
      i++;
    }
    return out.join("\n");
  }
  // 修复被旧版表格还原拆散的 markdown 表:旧代码把每两行数据间都插一条 | --- | --- |
  // 分隔行,marked 会把多余分隔行当数据单元格渲染成「--」。这里把连续表格行(含穿插的
  // 分隔行)聚合回一张表:只保留表头下一行分隔,其余多余分隔行丢弃。
  function repairMdTables(src) {
    const lines = String(src || "").split("\n");
    const isRow = (s) => /^\|.*\|\s*$/.test(s.trim());
    const isSepRow = (s) => /^\|[\s|-]+\|$/.test(s.trim()) && !/[A-Za-z0-9一-鿿]/.test(s);
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const l = lines[i];
      if (isRow(l) && !isSepRow(l)) {
        const cells = [];
        while (i < lines.length && (isRow(lines[i]) || isSepRow(lines[i]))) {
          if (isSepRow(lines[i])) { i++; continue; }
          cells.push(lines[i].trim());
          i++;
        }
        if (cells.length) {
          out.push(cells[0]);
          out.push("|" + cells[0].split("|").slice(1, -1).map(() => " --- ").join("|") + "|");
          for (let c = 1; c < cells.length; c++) out.push(cells[c]);
          out.push("");
          continue;
        }
      }
      out.push(l);
      i++;
    }
    return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }
  // 前端兜底清洗:滤掉 TUI 状态行/动画残片(与电脑端 bridge 同规则,多一道防线)
  function cleanMobile(t) {
    // 先把 box-drawing 表格还原成 markdown 表格,避免 │ 表格行被当作残片滤掉或挤成乱码
    const rows = String(tablesToMarkdown(t) || "").split("\n").filter((l) => {
      const x = l.trim().replace(/^[\x00-\x1f\x7f]+/, "").trim();
      if (!x) return false;
      if (/^[❯✻✢✶✽✱⏸◉·⎿;※]/.test(x)) return false;
      const dp = x.replace(/^[*✳◎·]+/, "");
      if (/^(Thought|Cogitat|Ponder|Philosophis|Combobulat|Decipher|Working|Thinking|Crunched|Brewed|Fiddle|Recap)/i.test(dp)) return false;
      // 思考计时行 "Thought 3s":剥 ANSI 后 h 后空格丢失,甚至拼成 "Tought3s",故宽松匹配
      if (/(?:Tought|Thought)[\s]?\d+\s*s\b/i.test(x) && !/[一-龥]/.test(x) && x.length <= 16) return false;
      if (/^(Tip:|esc to|\? for|Hit |←|disable recaps)/i.test(x)) return false;
      if (/^for\s*skills\s*that\s*work\s*in\s*any\s*project/i.test(x)) return false;
      if (/thinking/i.test(x) && !/[一-龥]/.test(x)) return false;
      if (/·\s*(thinking|thought for|done|↓)|tokens\b|ctrl\+o|\(\d+s?\s*·|\bthought for\b/i.test(x)) return false;
      if (/…$/.test(x) && !/[一-龥]/.test(x) && x.length <= 40) return false;
      // spinner 进度帧:英文词 + … + 数字(如 Drizzling…50),无中文、较短
      if (/…\s*\d+\s*$/.test(x) && !/[一-龥]/.test(x) && x.length <= 40) return false;
      // 星号/装饰前缀 + 纯数字 或 *词…数字(*400 / *Drizzling…5)
      if (/^[*✳◎·]+/.test(x)) {
        const sp = x.replace(/^[*✳◎·]+/, "");
        if (/^\d+\s*$/.test(sp) || (/…\s*\d*\s*$/.test(sp) && !/[一-龥]/.test(sp) && sp.length <= 40)) return false;
      }
      // 工具注解残片:单独文件名/路径行(非树形前缀、无中文、以代码/文本扩展名结尾)
      if (!/^(?:├|└|│)/.test(x) && !/[一-龥]/.test(x) && /^(?:[\w.\-/]*[\w])\.(?:py|js|ts|mjs|cjs|json|md|txt|cpp|c|h|hpp|css|scss|html|vue|svelte|svg|sh|bash|ya?ml|toml|ini)$/i.test(x)) return false;
      if (/^[●]\s*$/.test(x) || /^[-–—]\s*$/.test(x)) return false;
      // 工具注解帧(动词 + 单文件名/路径;TUI 帧里空格常丢失,如 "Showingpackage.json")。
      // 剥掉头部 spinner/装饰前缀(* ✳ 等)再判,否则 "* Listingprojectroot…" 这种带星号的
      // 动作帧会漏掉——星号只是动画前缀,动词后仍是「空格丢失的工具名」。
      const toolAnno = x.replace(/^[*✳◎·+\s]+/, "");
      if (/^(Showing|Reviewing|Running|Reading|Writing|Editing|Wrote|Searched|Saving|Saved|Browsing|Calling|Listing|Scanning|Inspecting|Examining)[A-Za-z0-9._\-/ ]{2,80}$/i.test(toolAnno)) return false;
      if (/[▝▘▖▗░▒▓▛▜▌▐]{2,}/.test(x)) return false;
      if (/(?:✳|◐|◑)\s*Claude Code/.test(x.replace(/^[\x00-\x1f;A-Za-z@]{0,3}/, ""))) return false;
      // 状态栏帧:首部残片后跟 ;◐/;◑ / ;✳ + 当前动作描述(如 "Tinkering…6;◐ 工程顶层结构")
      if (/;[◐◑✳]/u.test(x.replace(/^[\x00-\x1f;A-Za-z@]{0,8}/, ""))) return false;
      // TUI 状态栏帧:直接含 ;◐/;◑/;✳/;◒ 必为动画残片(剥前缀会漏掉 f;✳ 这种,这里不剥前缀直接判)
      if (/;[◐◑✳◒]/u.test(x)) return false;
      // 纯 box-drawing 边框行(如 ├┼┼┤ / └┴┴┘ / ┌─┬─┐):无文字内容,直接滤掉
      if (/^[│├└┌─┬┴┼┐┘┤┃]+$/.test(x)) return false;
      // 表格行(竖线 ≥2 且非树形引导,如 │会话名称│ID│):TUI 渲染的 markdown 表格,空格丢失难还原,滤掉
      if (!/^[│\s]*[├└┌]/.test(x) && !/^│\s/.test(x) && (x.match(/[│]/g) || []).length >= 2) return false;
      if (/^[*✳◎·]/.test(x)) {
        const sp = x.replace(/^[*✳◎·]+/, "");
        if (sp.includes(";✳") || (sp.length <= 32 && /…$/.test(sp) && !/[一-龥，。：]/.test(sp))) return false;
      }
      if (/^[;*✳…A-Za-z0-9]{1,3}$/.test(x)) return false;
      if (x.includes("�")) return false;
      return true;
    }).map((l) => {
      let s = l;
      // 中英文间补空格:TUI 剥 ANSI 会丢中英文边界空格(如"Web平台"/"FlaskWeb框架"/"ClaudeCode"),恢复可读性
      s = s.replace(/([A-Za-z0-9])([一-鿿])/g, "$1 $2").replace(/([一-鿿])([A-Za-z0-9])/g, "$1 $2");
      // 树形行空格规范化:TUI 剥 ANSI 后 box-drawing 行空格丢失,只补空格不改内容
      if (!/^[│├└┌]/.test(s.trim())) return s;
      // TUI 重绘会往 ── 连线中间混入空格(如 "├─ ─ dist/"),合并连线字符间空格,不影响 ── 后文件名前的正常空格
      s = s.replace(/(─\s*─)+/g, (m) => "─".repeat((m.match(/─/g) || []).length));
      // ── 后若空格被 TUI 吃掉直接贴文件名(如 "├──build/"),补一个空格;
      // 用 [^\s─━│├└┌] 断言后面是文件内容,避免把第二个 ─ 误当文件内容
      s = s.replace(/^([│├└┌]+\s*)([─━]+)(?=[^\s─━│├└┌])/, (_, a, b) => a + b + " ");
      s = s.replace(/#(?=\S)/g, "# ");
      s = s.replace(/(\S)#/g, "$1 #");
      return s;
    });
    // 相邻重复行去重(与电脑端 filterBodyLines 同规则):消除 TUI 重绘造成的刷屏
    const uniq = [];
    for (const l of rows) { if (uniq.length && l === uniq[uniq.length - 1]) continue; uniq.push(l); }
    // 修复被拆散的 markdown 表格(多余 | --- | --- | 分隔行),再做一次兜底
    return repairMdTables(uniq.join("\n").replace(/\n{3,}/g, "\n\n"))
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }
  function hh(ts) { // 时间显示
    if (!ts) return "";
    const d = new Date(ts);
    return (d.getMonth() + 1) + "-" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  // ---------- 消息发送/应答 ----------
  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
  let mid = 0;
  const nextId = () => "m" + (++mid) + "-" + Date.now();

  // ---------- 渲染 ----------
  function renderDevices() {
    const el = $("devlist");
    if (!devices.length) { el.innerHTML = '<div class="empty">没有在线电脑<br/>请先在电脑端设置页开启「云连接」</div>'; return; }
    el.innerHTML = devices.map((d) => `
      <button class="item" data-id="${esc(d.deviceId)}">
        <span class="dot online"></span>
        <span style="flex:1;min-width:0"><span class="tt">🖥 ${esc(d.deviceName)}</span>
        <div class="sub">${esc(d.ip || "")} · 上线 ${hh(d.since)}</div></span>
        <span class="stat">›</span>
      </button>`).join("");
    el.querySelectorAll(".item").forEach((b) => {
      b.addEventListener("click", () => { curDevice = devices.find((d) => d.deviceId === b.dataset.id); openSessions(); });
    });
  }

  function openSessions() {
    curSession = null; sessions = [];
    $("dev-name").textContent = curDevice ? "🖥 " + curDevice.deviceName : "";
    $("session-sub").textContent = "加载会话中…";
    go("sessions");
    fetchSessions();
  }

  async function fetchSessions() {
    if (!curDevice) return;
    const id = nextId();
    send({ type: "list-sessions", msgId: id, deviceId: curDevice.deviceId });
    // 服务端 20s 无应答则提示(设备可能刚离线)
    setTimeout(() => { if (sessions.length === 0 && $("v-sessions").classList.contains("on")) $("session-sub").textContent = "暂无应答，设备可能已离线"; }, 20000);
  }

  function renderSessions() {
    $("session-sub").textContent = curDevice ? curDevice.deviceName : "";
    const el = $("seslist");
    if (!sessions.length) { el.innerHTML = '<div class="empty">这台电脑还没有会话</div>'; return; }
    el.innerHTML = sessions.map((s) => `
      <button class="item" data-id="${esc(s.id)}">
        <span style="flex:1;min-width:0"><span class="tt">${esc(s.title || "未命名会话")}</span>
        <div class="sub">${esc((s.cwd || "") + (s.running ? " · 运行中" : ""))}</div></span>
        <span class="stat">(${esc(s.ctxTok != null ? Math.round(s.ctxTok / 1000) + "k" : "-")})<br/>${hh(s.updatedAt)}</span>
      </button>`).join("");
    el.querySelectorAll(".item").forEach((b) => {
      b.addEventListener("click", () => {
        const s = sessions.find((x) => x.id === b.dataset.id);
        if (s) openChat(s);
      });
    });
  }

  // 手机端新建会话:提示填名称(可选工作目录),发到设备开一个全新 claude 终端窗口
  function createSession() {
    if (!curDevice || !ws) return;
    const title = (prompt("新会话名称", "新会话") || "").trim();
    if (!title) return;
    // 工作目录可留空(设备端会用默认家目录)
    const cwd = (prompt("工作目录(可留空,默认设备家目录)") || "").trim();
    send({ type: "new-session", msgId: nextId(), deviceId: curDevice.deviceId, title, cwd });
    fetchSessions(); // 先刷新一次,设备回执会把新会话加进列表
  }

  // 手机端关闭会话:二次确认后发到设备,结束终端并删除记录
  function closeSession() {
    if (!curSession || !curDevice || !ws) return;
    if (!confirm("确定关闭会话「" + (curSession.title || "未命名会话") + "」？\n电脑端该终端也会一并关闭。")) return;
    const id = curSession.id;
    send({ type: "close-session", msgId: nextId(), deviceId: curDevice.deviceId, sessionId: id });
    // 本地先移除,返回会话列表(fetchSessions 回执后再刷新)
    msgsCache.delete(id);
    try { const o = msgsLoad(); delete o[id]; localStorage.setItem(MSGS_KEY, JSON.stringify(o)); } catch {}
    curSession = null;
    renderSessions();
    fetchSessions();
    go("sessions");
  }

  // DB 历史(role/blocks 结构,来自服务器 node:sqlite)→ 手机端气泡。
  // 打开会话时直接渲染完整历史记录:user 原文 / assistant 取 text 块拼 Markdown / ui(错误)打 ⚠。
  function dbToBubble(msg) {
    if (!msg) return null;
    const ts = Number(msg.ts) || 0;
    const seq = Number(msg.seq) || 0;   // 服务器消息序号,增量轮询用其做水位
    if (msg.role === "user") return { dir: "user", text: msg.text || "", ts, seq };
    if (msg.role === "assistant") {
      const blocks = Array.isArray(msg.blocks) ? msg.blocks : [];
      // 优先用 msg.text(choice 卡正文有时在 blocks 的 text 块,这里兜底拼接)
      const text = (msg.text || "").trim() || blocks.filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
      if (!text) return null;
      // 「选择方案」(停在 claude 原生选择器):附上选项,渲染成可点按钮。
      // type=choice-checkbox(多选复选框)时渲染「勾多个+提交」;choice 为单选按钮组。
      if ((msg.type === "choice" || msg.type === "choice-checkbox") && Array.isArray(msg.options) && msg.options.length) {
        return { dir: "ans", text, chooser: { options: msg.options, multiSelect: msg.type === "choice-checkbox" }, ts, seq };
      }
      return { dir: "ans", text, ts, seq };
    }
    if (msg.role === "ui") {
      const blocks = Array.isArray(msg.blocks) ? msg.blocks : [];
      const err = blocks.find((b) => b.type === "error");
      return { dir: "ans", text: "⚠ " + (err ? err.text : msg.text || "系统错误"), err: true, ts, seq };
    }
    return null;
  }
  function msgsFromDb(list) {
    const out = [];
    for (const m of list || []) { const b = dbToBubble(m); if (b) out.push(b); }
    return out;
  }

  // 已渲染消息的指纹:内容不变则返回相同字符串,用于判断是否需要重绘。
  // user 取原文、assistant 取文本+是否 running+选择器选项;任一变化都会改变指纹。
  function msgsFingerprint(list) {
    return (list || []).map((m) =>
      m.dir === "user" ? "u:" + m.text
        : (m.running ? "r:" : "a:") + m.text + "|" + ((m.chooser && m.chooser.options || []).map((o) => o.key).join(","))
    ).join("\n");
  }

  // 当前消息列表里「最后一条来自服务器(带 ts)」的时间戳,作为水位。
  // 本端刚发送/回答的临时气泡无 ts,会被跳过——轮询只在服务器历史「前进」时才覆盖,
  // 避免把本端刚发、尚未入库(JSONL 同步有延迟)的消息覆盖成旧版本。
  function lastDbTs(list) {
    for (let i = (list || []).length - 1; i >= 0; i--) if ((list[i].ts || 0) > 0) return list[i].ts;
    return 0;
  }

  // 消息列表里最大的 seq(服务器序号,增量水位);无 seq(本端临时气泡)视为 0。
  function maxSeqOf(list) {
    let m = 0;
    for (const b of list || []) if ((b.seq || 0) > m) m = b.seq;
    return m;
  }

  // 选过的选择器按钮要去掉:某 choice 之后已有新的 assistant 回答 = 用户已选过、claude 已继续,
  // 不再渲染旧按钮(否则自动刷新/重复打开会让按钮反复出现,可重复点)。从后往前,找到最近一条被
  // 后续纯回答覆盖的选择器就清掉其 chooser。
  function stripOldChoosers(list) {
    let seenLaterAns = false;
    for (let i = (list || []).length - 1; i >= 0; i--) {
      if (list[i].dir === "ans" && list[i].chooser) {
        if (seenLaterAns) list[i].chooser = null;
      } else if (list[i].dir === "ans") {
        seenLaterAns = true;
      }
    }
  }

  // 会话打开期间定时拉服务器 DB 历史(权威),桌面端/其它端产生的新消息自动跟进。
  // pendingExec(本端正在回答)时不发请求、也由 messages 分支跳过覆盖,避免打断"回答中"动画。
  function startAutoRefresh() {
    stopAutoRefresh();
    chatTimer = setInterval(() => {
      if (pendingExec) return;                                        // 本端在回答:先不动
      if (!curSession || !curDevice) return;                          // 不在会话页
      if (!ws || ws.readyState !== 1) return;                         // 断线时不发
      // 带 afterSeq 增量拉取:服务器只回 seq>水位的消息,长会话不再每次拉全量
      send({ type: "messages", msgId: nextId(), deviceId: curDevice.deviceId, sessionId: curSession.id, afterSeq: lastMsgSeq[curSession.id] || 0 });
    }, 5000);
  }
  function stopAutoRefresh() { if (chatTimer) { clearInterval(chatTimer); chatTimer = null; } }

  function openChat(s) {
    curSession = s;
    lastAnsIndex = -1; pendingExec = null;
    // 复用本会话已缓存的历史会话(切走再切回、断线重连、刷新后重开都能恢复),不再清空
    msgs = msgsLoad()[s.id] || msgsCache.get(s.id) || [];
    lastMsgSeq[s.id] = maxSeqOf(msgs);   // 恢复该会话已确认的服务器消息水位(增量轮询起点)
    $("chat-title").textContent = s.title || "未命名会话";
    $("chat-cwd").textContent = s.cwd || "";
    renderMsgs();
    msgsKey = msgsFingerprint(msgs);   // 记录打开瞬间已渲染内容,首轮 messages 若一致则不重绘
    $("chat-ctx")._shown = false;
    go("chat");
    hideBanner();
    // 拉取近期上下文(设备把该会话末端实录回传,让手机看到之前对话)
    send({ type: "open-session", msgId: nextId(), deviceId: curDevice.deviceId, sessionId: s.id });
    // 从服务器 DB 拉结构化历史:打开的瞬间直接渲染完整对话气泡(设备离线也能看到已入库的记录)
    send({ type: "messages", msgId: nextId(), deviceId: curDevice.deviceId, sessionId: s.id });
    startAutoRefresh();   // 会话打开期间定时自动刷新,桌端/其它端新消息自动跟进
    $("in-msg").focus();
  }

  // 把 Markdown 回答渲染成 HTML(经 DOMPurify 消毒,防 XSS)
  function mdHtml(text) {
    try {
      return DOMPurify.sanitize(marked.parse(text || ""));
    } catch {
      return esc(text || "");
    }
  }

  function renderMsgs() {
    const el = $("msgs");
    el.innerHTML = msgs.map((m, i) => {
      if (m.dir === "user") return `<div class="bubble user">${esc(m.text)}</div>`;
      if (m.running) return `<div class="bubble ans running" data-i="${i}"><span class="running-dot">◌</span> 回答中…</div>`;
      // 回答按 Markdown 渲染,手机上更精简清晰;失败时退回纯文本
      let html = `<div class="bubble ans md" data-i="${i}">${mdHtml(cleanMobile(m.text))}</div>`;
      // 电脑端弹出原生选择器:在回答下渲染可点按钮。
      // 单选(choice)=点一个即发 choose;多选(choice-checkbox)=勾多个 + 点「提交」才发 indices。
      if (m.chooser && m.chooser.options && m.chooser.options.length) {
        if (m.chooser.multiSelect) {
          const sel = m.chooser.selected || [];
          html += `<div class="chooser multi" data-i="${i}">` +
            m.chooser.options.map((o) =>
              `<label class="chooser-item${sel.includes(o.key) ? " on" : ""}"><input type="checkbox" data-key="${esc(o.key)}"${sel.includes(o.key) ? " checked" : ""}><span class="k">${esc(o.key)}</span><span class="lb">${esc(o.label)}</span></label>`
            ).join("") +
            `<button class="chooser-submit" data-i="${i}">✔ 提交选择</button></div>`;
        } else {
          html += `<div class="chooser" data-i="${i}">` +
            m.chooser.options.map((o) =>
              `<button class="chooser-btn" data-key="${esc(o.key)}"><span class="k">${esc(o.key)}</span><span class="lb">${esc(o.label)}</span></button>`
            ).join("") + `</div>`;
        }
      }
      return html;
    }).join("");
    if (curSession) { msgsCache.set(curSession.id, msgs.map((m) => ({ ...m }))); msgsSave(); }
    el.scrollTop = el.scrollHeight;
  }

  function setBanner(t) { $("chat-banner").textContent = t; $("chat-banner").style.display = t ? "block" : "none"; }
  const hideBanner = () => setBanner("");

  // ---------- 执行(发消息) ----------
  function doSend() {
    const text = $("in-msg").value.trim();
    if (!text || !curSession || !curDevice) return;
    if (pendingExec) { toast("上一条还在回答中"); return; }
    $("in-msg").value = "";
    msgs.push({ dir: "user", text });
    msgs.push({ dir: "ans", running: true, text: "" });
    lastAnsIndex = msgs.length - 1;
    renderMsgs();
    const id = nextId();
    pendingExec = id;
    $("btn-stop").style.display = "inline-block";
    send({ type: "exec", msgId: id, deviceId: curDevice.deviceId, sessionId: curSession.id, text });
    // 兜底超时提示:30 分钟没回(电脑端 claude 某次回答特别长/卡死)给个提醒
    setTimeout(() => {
      if (pendingExec === id) toast("等待回答已很久，可点「停止」中断");
    }, 30 * 60 * 1000);
  }

  function doStop() {
    if (!curSession || !curDevice) return;
    send({ type: "stop", msgId: nextId(), deviceId: curDevice.deviceId, sessionId: curSession.id });
    toast("已发送停止");
  }

  // 点选电脑端原生选择器的某项(单选):发 choose,电脑端注入「方向键×N+回车」选定后 claude 继续回答
  function doChoose(msgIdx, key) {
    const m = msgs[msgIdx];
    if (!m || !m.chooser || !curSession || !curDevice) return;
    if (pendingExec) { toast("上一条还在处理中"); return; }
    const opt = (m.chooser.options || []).find((o) => String(o.key) === String(key));
    const label = opt ? `${opt.key}. ${opt.label}` : `选项 ${key}`;
    m.chooser = null;  // 清掉按钮,防重复点
    msgs.push({ dir: "user", text: "👉 我选择:" + label });
    msgs.push({ dir: "ans", running: true, text: "" });
    lastAnsIndex = msgs.length - 1;
    renderMsgs();
    const id = nextId();
    pendingExec = id;
    $("btn-stop").style.display = "inline-block";
    send({ type: "choose", msgId: id, deviceId: curDevice.deviceId, sessionId: curSession.id, index: Number(key) });
  }

  // 多选(复选框选择器)提交:收集所有勾选项,发 indices 数组,电脑端逐个勾选后提交
  function doSubmitMulti(msgIdx) {
    const m = msgs[msgIdx];
    if (!m || !m.chooser || !curSession || !curDevice) return;
    if (m.chooser.multiSelect !== true) return;
    const selected = (m.chooser.selected || []).slice();
    if (!selected.length) { toast("请至少勾选一个选项"); return; }
    if (pendingExec) { toast("上一条还在处理中"); return; }
    const labels = (m.chooser.options || []).filter((o) => selected.includes(o.key)).map((o) => `${o.key}. ${o.label}`);
    m.chooser = null;  // 清掉按钮,防重复提交
    msgs.push({ dir: "user", text: "👉 我选择:" + labels.join("、") });
    msgs.push({ dir: "ans", running: true, text: "" });
    lastAnsIndex = msgs.length - 1;
    renderMsgs();
    const id = nextId();
    pendingExec = id;
    $("btn-stop").style.display = "inline-block";
    send({ type: "choose", msgId: id, deviceId: curDevice.deviceId, sessionId: curSession.id, indices: selected.map(Number) });
  }

  // ---------- WebSocket ----------
  function connect() {
    manualClose = false;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    const host = (hostInput.value || autoHost).trim().replace(/\/+$/, "");
    token = (tokenInput.value || "").trim();
    localStorage.setItem("cd-token", token);
    localStorage.setItem("cd-host", host);

    let url = host;
    // 允许只填 ip:port / 主机:端口,自动补 ws:// 前缀与 /ws 路径
    if (!/^wss?:\/\//i.test(url)) url = "ws://" + url;
    if (!/\/ws$/i.test(url)) url += (url.endsWith("/") ? "" : "/") + "ws";

    $("btn-connect").disabled = true;
    $("btn-connect").textContent = "连接中…";

    let created = false;
    try { ws = new WebSocket(url); created = true; } catch (e) {
      toast("地址无效：" + e.message); $("btn-connect").disabled = false; $("btn-connect").textContent = "连接"; return;
    }

    ws.onopen = () => {
      retry = 0;
      send({ type: "hello", role: "phone", token });
    };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "welcome") {
        if (!m.ok) { toast(m.error || "连接失败"); try { ws.close(); } catch {} return; }
        $("btn-connect").textContent = "已连接 ✓";
        hideBanner();
        devices = m.devices || [];
        renderDevices();
        go("devices");
      } else if (m.type === "devices") {
        devices = m.devices || [];
        if ($("v-devices").classList.contains("on")) renderDevices();
        // 若停在会话/对话页,提示设备上下线
        if (curDevice) {
          const alive = devices.some((d) => d.deviceId === curDevice.deviceId);
          if (!alive) { setBanner("所选电脑已离线，请返回重选"); }
        }
      } else if (m.type === "sessions") {
        sessions = m.sessions || [];
        renderSessions();
      } else if (m.type === "session-info") {
        if (curSession && m.sessionId === curSession.id) {
          // 本地已缓存本会话历史(切回/重连),优先展示缓存的气泡;电脑端 recent 记录仅作参考框
          const box = $("chat-ctx");
          if (msgs.length && !box._shown) {
            box.style.display = "none";
            return;
          }
          box.style.display = "block";
          box._shown = true;
          // 最近记录同样按 Markdown 精简渲染;无记录时显示纯文本提示
          box.innerHTML = m.tail
            ? '<div class="tt-top">—— 电脑端该会话最近记录 ——</div><div class="md">' + mdHtml(cleanMobile(m.tail)) + '</div>'
            : "（该会话还没有对话记录，发出的消息会同步到电脑端）";
        }
      } else if (m.type === "messages") {
        // 服务器 MySQL 历史:以它为本会话权威记录,保证与电脑端看到的内容一致。
        // 打开会话即重建气泡(不再"有本地缓存就不读服务器"),否则手机端旧缓存会让两端不一致。
        // 仅当手机端此刻正跑着一条回答(pendingExec)时不覆盖,避免打断正在进行的对话。
        // 带 afterSeq 的是每 5s 增量轮询(只回 seq>水位的新消息,合并追加);不带的是首屏/恢复的全量覆盖。
        if (curSession && m.sessionId === curSession.id && !pendingExec) {
          const isIncr = (m.afterSeq || 0) > 0;
          const hist = msgsFromDb(m.messages);
          if (!hist.length) return;  // 服务器无历史:保留当前显示(含本端刚发送、尚未入库的消息)
          const wm = lastMsgSeq[curSession.id] || 0;
          if (isIncr) {
            // 增量:只追加 seq>水位的消息;服务器按 afterSeq 已过滤,这里再兜底过滤一次
            const add = hist.filter((b) => b.seq > wm);
            if (!add.length) return;
            // 本端刚发的消息(本地临时气泡无 seq)与服务器回显内容相同,合并时去掉本地那条,避免重复气泡
            for (const nb of add) {
              for (let li = msgs.length - 1; li >= Math.max(0, msgs.length - 6); li--) {
                const lm = msgs[li];
                if (!(lm.seq > 0) && lm.dir === nb.dir && (lm.text || "") === (nb.text || "")) { msgs.splice(li, 1); break; }
              }
            }
            msgs = msgs.concat(add);
            lastMsgSeq[curSession.id] = Math.max(wm, maxSeqOf(hist));
            lastAnsIndex = -1;
            stripOldChoosers(msgs);            // 新追加的后续回答会盖掉旧选择器按钮
            msgsKey = msgsFingerprint(msgs);
            renderMsgs();
          } else {
            // 全量覆盖(打开会话 / 断线重连后的首轮)
            stripOldChoosers(hist);
            const key = msgsFingerprint(hist);
            if (lastDbTs(hist) <= lastDbTs(msgs)) return;  // 服务器历史未前进(该轮可能尚未入库):保留当前显示
            if (key === msgsKey) return;  // 内容没变:不重绘,防滚动跳变/输入框失焦
            msgs = hist;
            msgsKey = key;
            lastMsgSeq[curSession.id] = maxSeqOf(hist);
            lastAnsIndex = -1;
            renderMsgs();
          }
        }
      } else if (m.type === "result") {
        if (m.msgId === pendingExec) {
          pendingExec = null;
          $("btn-stop").style.display = "none";
          if (lastAnsIndex >= 0 && msgs[lastAnsIndex]) {
            if (m.ok) {
              msgs[lastAnsIndex].running = false;
              msgs[lastAnsIndex].text = cleanMobile(m.text) || "(空回复)";
              // 电脑端弹出了原生选择器:存到消息上,renderMsgs 渲染成可点按钮
              if (m.chooser && m.chooser.options && m.chooser.options.length) {
                msgs[lastAnsIndex].chooser = m.chooser;
              }
            } else {
              msgs[lastAnsIndex] = { dir: "ans", text: "⚠ " + (m.error || "执行失败"), running: false };
              msgs[lastAnsIndex].err = true;
            }
            renderMsgs();
          }
        }
      } else if (m.type === "session-created") {
        if (m.ok && m.session) {
          toast("已创建会话：" + m.session.title);
          fetchSessions(); // 新会话出现在列表顶部
        } else {
          toast(m.error || "创建失败");
        }
      } else if (m.type === "answer") {
        // stop / 新建会话报错 / 其它受理类应答:仅提示
        if (m.ok === false) toast(m.error || "操作失败");
      }
    };
    ws.onclose = () => {
      $("btn-connect").disabled = false; $("btn-connect").textContent = "连接";
      if (manualClose) return;
      // 自动重连:指数退避 1s → 30s 封顶
      const wait = Math.min(1000 * Math.pow(2, retry), 30000);
      retry = Math.min(retry + 1, 8);
      if (curSession) setBanner("连接断开，" + Math.round(wait / 1000) + "s 后重连…");
      reconnectTimer = setTimeout(() => connect(), wait);
    };
    ws.onerror = () => { /* 由 onclose 统一处理重连 */ };
  }

  // ---------- 事件绑定 ----------
  $("btn-connect").onclick = connect;
  $("btn-device-back").onclick = () => { manualClose = true; try { ws && ws.close(); } catch {} go("connect"); $("btn-connect").textContent = "连接"; };
  $("btn-session-back").onclick = () => { renderDevices(); go("devices"); };
  $("btn-chat-back").onclick = () => { stopAutoRefresh(); pendingExec = null; curSession = null; renderSessions(); go("sessions"); };
  $("btn-refresh-sessions").onclick = () => fetchSessions();
  $("btn-close-session").onclick = () => closeSession();
  $("btn-send").onclick = doSend;
  $("btn-stop").onclick = doStop;
  // 选择器按钮用事件委托(renderMsgs 每次 innerHTML 重渲染,单独绑定会丢)
  $("msgs").addEventListener("click", (e) => {
    // 多选「提交」按钮
    const sub = e.target.closest(".chooser-submit");
    if (sub) { doSubmitMulti(Number(sub.dataset.i)); return; }
    // 单选按钮:点一个即选择
    const btn = e.target.closest(".chooser-btn");
    if (!btn) return;
    const wrap = btn.closest(".chooser");
    if (!wrap) return;
    doChoose(Number(wrap.dataset.i), btn.dataset.key);
  });
  // 多选复选框勾选变更:把勾选状态存到该消息的 chooser.selected,并局部更新样式(不整页重建,避免输入框失焦)
  $("msgs").addEventListener("change", (e) => {
    const cb = e.target;
    if (!cb.matches(".chooser input[type=checkbox]")) return;
    const wrap = cb.closest(".chooser");
    if (!wrap) return;
    const m = msgs[Number(wrap.dataset.i)];
    if (!m || !m.chooser) return;
    const key = cb.dataset.key;
    m.chooser.selected = m.chooser.selected || [];
    if (cb.checked) { if (!m.chooser.selected.includes(key)) m.chooser.selected.push(key); }
    else m.chooser.selected = m.chooser.selected.filter((k) => k !== key);
    const item = cb.closest(".chooser-item");
    if (item) item.classList.toggle("on", cb.checked);
  });
  $("in-msg").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doSend(); } });
  tokenInput.addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });
  hostInput.addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });

  // 手机上软键盘弹起时保证输入框可见
  $("in-msg").addEventListener("focus", () => setTimeout(() => $("msgs").scrollTop = $("msgs").scrollHeight, 200));

  // 软键盘适配:监听可视视口高度,同步到 --app-h 让 body/输入框跟随键盘上移
  // (iOS 弹键盘时 visualViewport.height 变小,靠它把 composer 顶到键盘上方)
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const syncVH = () => {
      const h = Math.round(vv.height);
      const cur = document.documentElement.style.getPropertyValue("--app-h");
      if (cur !== h + "px") document.documentElement.style.setProperty("--app-h", h + "px");
    };
    vv.addEventListener("resize", syncVH);
    vv.addEventListener("scroll", syncVH);
    syncVH();
  }
})();
</script>
</body>
</html>
